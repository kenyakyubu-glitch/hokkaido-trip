<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海道 男三人旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#EEF3F4; --paper:#FFFFFF; --ink:#16262B; --mute:#5D7077;
  --sign:#00704A; --sign-deep:#00573A; --caution:#F2C200; --line:#D3DEE1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --snow:#0F1A1D; --paper:#17262A; --ink:#E6EEF0; --mute:#93A7AD;
    --sign:#0E8A5D; --sign-deep:#0A6E4A; --caution:#E5B800; --line:#2A3D42;
  }
}
:root[data-theme="dark"]{
  --snow:#0F1A1D; --paper:#17262A; --ink:#E6EEF0; --mute:#93A7AD;
  --sign:#0E8A5D; --sign-deep:#0A6E4A; --caution:#E5B800; --line:#2A3D42;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--snow); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-feature-settings:"tnum"}
.wrap{max-width:560px; margin:0 auto; padding:0 16px}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--caution); outline-offset:2px}

/* 案内標識のヒーロー */
.sign{
  margin:16px 0 20px; background:var(--sign); color:#fff; border-radius:10px;
  padding:6px; box-shadow:0 0 0 2px var(--sign-deep);
}
.sign-in{border:2px solid #fff; border-radius:6px; padding:14px 16px 12px}
.sign h1{margin:0 0 10px; font-size:22px; font-weight:700; letter-spacing:.04em}
.route{display:grid; gap:6px}
.route-row{display:flex; align-items:baseline; gap:12px}
.route-row .d{font-size:15px; opacity:.85; width:5.2em; flex:none}
.route-row .to{font-size:20px; font-weight:700}
.route-row .km{margin-left:auto; font-size:14px; border:1.5px solid #fff; border-radius:4px; padding:0 6px}
.sign-foot{display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:2px solid rgba(255,255,255,.55); font-size:14px}
.sign-foot b{font-size:20px; font-weight:700}

/* 日付の切り替え */
.days{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:14px}
.days button{
  border:2px solid var(--line); background:var(--paper); border-radius:8px; padding:6px 0;
  display:flex; flex-direction:column; align-items:center; cursor:pointer;
}
.days button .num{font-size:24px; line-height:1}
.days button span:last-child{font-size:13px; color:var(--mute)}
.days button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.days button[aria-pressed="true"] span:last-child{color:inherit; opacity:.8}
.theme{margin:0 0 6px; font-size:19px; font-weight:700}
.theme-sub{margin:0 0 16px; color:var(--mute); font-size:14px}

/* 行程 */
.tl{list-style:none; margin:0; padding:0; border-left:3px solid var(--line); margin-left:58px}
.tl li{position:relative; padding:0 0 16px 16px}
.tl li::before{content:""; position:absolute; left:-8px; top:8px; width:13px; height:13px; border-radius:50%; background:var(--paper); border:3px solid var(--sign)}
.tl li.now::before{background:var(--caution); border-color:var(--ink)}
.tl .t{position:absolute; left:-66px; top:1px; width:50px; text-align:right; font-size:18px; color:var(--mute); line-height:1.3}
.tl .what{font-weight:700}
.tl .where{font-size:14px; color:var(--mute)}
.tl .note{font-size:14px; margin-top:2px}
.flag{
  display:inline-block; margin-left:6px; padding:0 7px; border-radius:4px; font-size:12px; font-weight:700;
  background:var(--caution); color:#16262B; vertical-align:2px;
}
.tl li.now .what::after{content:"いまここ"; margin-left:8px; font-size:12px; color:var(--sign); font-weight:700}

/* 共通の箱 */
section[hidden]{display:none}
.block{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px}
.block h2{margin:0 0 8px; font-size:17px}
.help{margin:0 0 10px; font-size:13px; color:var(--mute)}
.check{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--sign); flex:none}
.check small{display:block; color:var(--mute); font-size:13px}
.check input:checked + span{color:var(--mute); text-decoration:line-through}

/* 精算 */
.members{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
input[type=text],input[type=number],input[inputmode],select{
  width:100%; border:2px solid var(--line); background:var(--snow); border-radius:7px; padding:8px 10px; min-height:44px;
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.split{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:14px}
.split label{display:flex; gap:6px; align-items:center}
.split input{accent-color:var(--sign); width:18px; height:18px}
.btn{
  margin-top:10px; width:100%; min-height:46px; border:0; border-radius:8px; background:var(--sign); color:#fff; font-weight:700; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.exp{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:15px}
.exp:first-child{border-top:0}
.exp small{display:block; color:var(--mute); font-size:12px}
.exp .amt{font-size:20px; white-space:nowrap}
.exp button{border:0; background:none; color:var(--mute); font-size:13px; cursor:pointer; padding:0 0 0 8px; min-height:32px}
.empty{color:var(--mute); font-size:14px; margin:0}
.pay{display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:16px}
.pay:first-child{border-top:0}
.pay .arrow{color:var(--mute)}
.pay .amt{margin-left:auto; font-size:24px; font-weight:700}
.total{display:flex; justify-content:space-between; font-size:14px; color:var(--mute); margin-bottom:6px}
.total b{font-size:18px; color:var(--ink)}

/* 下のタブ */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); z-index:5;
}
nav.tabs .in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0; background:none; padding:10px 0 12px; font-size:15px; font-weight:700; color:var(--mute); cursor:pointer; border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--sign); border-top-color:var(--sign)}
.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="sign" aria-label="旅の概要">
    <div class="sign-in">
      <h1>北海道 男三人旅</h1>
      <div class="route">
        <div class="route-row"><span class="d">13日 金</span><span class="to">札幌</span><span class="km">市場と夜</span></div>
        <div class="route-row"><span class="d">14日 土</span><span class="to">小樽・余市</span><span class="km">ドライブ</span></div>
        <div class="route-row"><span class="d">15日 日</span><span class="to">定山渓</span><span class="km">温泉</span></div>
      </div>
      <div class="sign-foot">
        <span>新千歳着 <b class="num">9:15</b></span>
        <span id="countdown"></span>
        <span>新千歳発 <b class="num">20:20</b></span>
      </div>
    </div>
  </header>

  <section id="tab-plan" aria-label="行程">
    <div class="days" id="days"></div>
    <p class="theme" id="theme"></p>
    <p class="theme-sub" id="themeSub"></p>
    <ol class="tl" id="timeline"></ol>
  </section>

  <section id="tab-prep" aria-label="準備" hidden>
    <div class="block">
      <h2>予約・確認</h2>
      <p class="help">済んだらチェック。チェックはこのスマホにだけ残ります。</p>
      <div id="resv"></div>
    </div>
    <div class="block">
      <h2>持ち物</h2>
      <div id="items"></div>
    </div>
  </section>

  <section id="tab-money" aria-label="精算" hidden>
    <div class="block">
      <h2>メンバー</h2>
      <div class="members" id="members"></div>
    </div>
    <div class="block">
      <h2>立て替えを追加</h2>
      <input type="text" id="eItem" placeholder="何に払った？（例: ガソリン）" aria-label="項目">
      <div class="row2">
        <input type="number" id="eAmt" inputmode="numeric" min="0" placeholder="金額（円）" aria-label="金額">
        <select id="ePayer" aria-label="払った人"></select>
      </div>
      <div class="split" id="eSplit" aria-label="割る人"></div>
      <button class="btn" id="eAdd">追加する</button>
    </div>
    <div class="block">
      <div class="total"><span>これまでの合計</span><b class="num" id="sum">0円</b></div>
      <div id="expList"></div>
    </div>
    <div class="block">
      <h2>だれが、だれに払う</h2>
      <div id="settle"></div>
      <button class="btn ghost" id="copy">LINE に貼る用にコピー</button>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="ページ切り替え">
  <div class="in" role="tablist">
    <button role="tab" aria-selected="true" data-tab="plan">行程</button>
    <button role="tab" aria-selected="false" data-tab="prep">準備</button>
    <button role="tab" aria-selected="false" data-tab="money">精算</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const DAYS = [
  {date:"2026-11-13", d:"13", w:"金", theme:"北海道上陸、札幌で食べて飲む", sub:"二条市場 → ビール博物館 → サウナ → すすきの", plan:[
    ["9:15","新千歳空港に到着","新千歳空港","便名を書いておく"],
    ["9:15","レンタカーを受け取る","ニコニコレンタカー 新千歳空港","スタッドレスか確認","確認"],
    ["11:45","二条市場で海鮮ランチ","二条市場（車で約1時間）","候補は大磯 本店、丼兵衛"],
    ["13:15","サッポロビール博物館","札幌市東区北7条東9丁目","運転する人は試飲できない","確認"],
    ["15:00","ホテルにチェックイン","ドーミーインPREMIUM札幌","駐車場は先着順","確認"],
    ["16:30","大浴場とサウナ","ホテル"],
    ["18:00","夕食","すすきの","2日目もジンギスカンなので、どちらかを変える","相談"],
    ["20:00","すすきので飲み歩き","すすきの"],
    ["21:30","夜鳴きそばと再入浴","ホテル"]
  ]},
  {date:"2026-11-14", d:"14", w:"土", theme:"小樽と余市をドライブ", sub:"運河と寿司、ウイスキーの蒸溜所。運転担当を決めておく", plan:[
    ["7:00","ホテルの朝食（海鮮丼）","ホテル","朝食付きか確認","確認"],
    ["8:30","札幌を出発","","この日の運転担当を決める","相談"],
    ["9:30","小樽運河","小樽（車で約1時間）","運河クルーズ（約40分）も候補"],
    ["10:30","堺町通りで食べ歩き","小樽"],
    ["12:00","寿司・海鮮ランチ","小樽"],
    ["13:30","ニッカウヰスキー余市蒸溜所","余市町黒川町7-6","ガイド見学は予約制。ミュージアムは予約なしで入れる","予約"],
    ["15:00","札幌へ戻る",""],
    ["17:00","ホテルでサウナ・休憩","ホテル"],
    ["18:30","ジンギスカン、すすきの","すすきの"]
  ]},
  {date:"2026-11-15", d:"15", w:"日", theme:"温泉で締めて空港へ", sub:"豊平峡温泉の露天風呂とカレー。空港では3時間ほど空く", plan:[
    ["7:00","ホテルの朝食","ホテル"],
    ["9:00","朝風呂と荷造り","ホテル"],
    ["11:00","チェックアウト","ホテル"],
    ["11:00","定山渓方面へドライブ","","この日の運転担当を決める","相談"],
    ["12:00","豊平峡温泉、カレーとナン","豊平峡温泉","タオルを持っていくか確認"],
    ["14:30","定山渓を散策","定山渓温泉"],
    ["15:30","新千歳空港へ",""],
    ["17:15","レンタカーを返す","ニコニコレンタカー 新千歳空港","ガソリン満タン返しか確認","確認"],
    ["18:00","空港で夕食とお土産","新千歳空港"],
    ["20:20","新千歳空港を出発","新千歳空港","便名を書いておく"]
  ]}
];
const RESV = [
  ["hotel","ホテル 2泊","朝食付きか、予約番号"],
  ["car","レンタカー","スタッドレスタイヤか"],
  ["park","ホテルの駐車場","先着順。車高・車幅の制限"],
  ["yoichi","余市蒸溜所のガイド見学","11/14・3人。埋まっていたらミュージアムだけ"],
  ["driver","日ごとの運転担当","飲む日と運転する日を分ける"],
  ["flight","行き・帰りの便名","ここに書いておく"]
];
const ITEMS = [
  ["license","運転免許証","運転する人は全員"],
  ["coat","防寒着・手袋",""],
  ["shoes","滑りにくい靴",""],
  ["battery","充電器・モバイルバッテリー",""],
  ["usb","車用の USB 充電器","1人が持てば足りる"],
  ["towel","温泉用タオル","豊平峡温泉"],
  ["cash","現金","市場・温泉など"]
];

const KEY = "hokkaido-trip-2026";
let state = {checks:{}, members:["Aさん","Bさん","Cさん"], exps:[]};
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => Math.round(n).toLocaleString("ja-JP") + "円";

/* 日付と「いまここ」 */
function todayStr(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
const today = todayStr();
let current = Math.max(0, DAYS.findIndex(d => d.date === today));

function countdown(){
  const start = new Date("2026-11-13T09:15:00+09:00"), end = new Date("2026-11-15T20:20:00+09:00"), now = new Date();
  let t;
  if(now < start){ const days = Math.ceil((start - now) / 86400000); t = "出発まで " + days + "日"; }
  else if(now <= end){ const i = DAYS.findIndex(d => d.date === today); t = (i + 1) + "日目"; }
  else t = "おつかれさま";
  $("countdown").textContent = t;
}

function renderDays(){
  $("days").innerHTML = DAYS.map((d,i) =>
    `<button aria-pressed="${i===current}" data-i="${i}"><span class="num">${d.d}</span><span>${d.w}曜</span></button>`).join("");
  $("days").querySelectorAll("button").forEach(b => b.onclick = () => { current = +b.dataset.i; renderDays(); renderPlan(); });
}
function nowIndex(day){
  if(day.date !== today) return -1;
  const n = new Date(), mins = n.getHours()*60 + n.getMinutes();
  let idx = -1;
  day.plan.forEach((p,i) => { const [h,m] = p[0].split(":").map(Number); if(h*60+m <= mins) idx = i; });
  return idx;
}
function renderPlan(){
  const day = DAYS[current], ni = nowIndex(day);
  $("theme").textContent = day.theme;
  $("themeSub").textContent = day.sub;
  $("timeline").innerHTML = day.plan.map((p,i) => {
    const [t, what, where, note, flag] = p;
    return `<li class="${i===ni?"now":""}"><span class="t num">${t}</span>
      <div class="what">${esc(what)}${flag?`<span class="flag">${flag}</span>`:""}</div>
      ${where?`<div class="where">${esc(where)}</div>`:""}
      ${note?`<div class="note">${esc(note)}</div>`:""}</li>`;
  }).join("");
}

/* 準備 */
function renderChecks(el, list){
  el.innerHTML = list.map(([k,label,sub]) =>
    `<label class="check"><input type="checkbox" data-k="${k}" ${state.checks[k]?"checked":""}><span>${esc(label)}${sub?`<small>${esc(sub)}</small>`:""}</span></label>`).join("");
  el.querySelectorAll("input").forEach(c => c.onchange = () => { state.checks[c.dataset.k] = c.checked; save(); });
}

/* 精算 */
function renderMembers(){
  $("members").innerHTML = state.members.map((m,i) => `<input type="text" value="${esc(m)}" data-i="${i}" aria-label="メンバー${i+1}の名前">`).join("");
  $("members").querySelectorAll("input").forEach(inp => inp.onchange = () => {
    state.members[+inp.dataset.i] = inp.value.trim() || ("メンバー" + (+inp.dataset.i + 1)); save(); renderMoney();
  });
}
function renderForm(){
  $("ePayer").innerHTML = state.members.map((m,i) => `<option value="${i}">${esc(m)}が払った</option>`).join("");
  $("eSplit").innerHTML = "<span>割る人:</span>" + state.members.map((m,i) => `<label><input type="checkbox" value="${i}" checked>${esc(m)}</label>`).join("");
}
function settle(){
  const bal = state.members.map(() => 0);
  state.exps.forEach(e => {
    const share = e.amt / e.split.length;
    bal[e.payer] += e.amt;
    e.split.forEach(i => bal[i] -= share);
  });
  const pos = [], neg = [];
  bal.forEach((b,i) => { if(b > 0.5) pos.push([i,b]); else if(b < -0.5) neg.push([i,-b]); });
  pos.sort((a,b) => b[1]-a[1]); neg.sort((a,b) => b[1]-a[1]);
  const out = [];
  while(pos.length && neg.length){
    const x = Math.min(pos[0][1], neg[0][1]);
    out.push([neg[0][0], pos[0][0], x]);
    pos[0][1] -= x; neg[0][1] -= x;
    if(pos[0][1] < 0.5) pos.shift();
    if(neg[0][1] < 0.5) neg.shift();
  }
  return out;
}
function renderMoney(){
  renderForm();
  const total = state.exps.reduce((s,e) => s + e.amt, 0);
  $("sum").textContent = yen(total);
  $("expList").innerHTML = state.exps.length ? state.exps.map((e,i) =>
    `<div class="exp"><div>${esc(e.item)}<small>${esc(state.members[e.payer])}が払った・${e.split.length===state.members.length?"全員で割る":e.split.map(j=>esc(state.members[j])).join("、")+"で割る"}</small></div>
     <div style="display:flex;align-items:center"><span class="amt num">${yen(e.amt)}</span><button data-i="${i}" aria-label="${esc(e.item)}を取り消す">取消</button></div></div>`).reverse().join("")
    : `<p class="empty">まだありません。払ったらすぐ上で追加しておくと、最後に揉めません。</p>`;
  $("expList").querySelectorAll("button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(confirm(`「${state.exps[i].item}」を取り消しますか？`)){ state.exps.splice(i,1); save(); renderMoney(); }
  });
  const s = settle();
  $("settle").innerHTML = s.length ? s.map(([from,to,x]) =>
    `<div class="pay"><span>${esc(state.members[from])}</span><span class="arrow">から</span><span>${esc(state.members[to])}へ</span><span class="amt num">${yen(x)}</span></div>`).join("")
    : `<p class="empty">いまは貸し借りなし。</p>`;
}
$("eAdd").onclick = () => {
  const item = $("eItem").value.trim(), amt = Math.round(Number($("eAmt").value));
  const split = [...$("eSplit").querySelectorAll("input:checked")].map(c => +c.value);
  if(!item || !(amt > 0)){ toast("項目と金額を入れてください"); return; }
  if(!split.length){ toast("割る人を1人以上選んでください"); return; }
  state.exps.push({item, amt, payer:+$("ePayer").value, split});
  save(); $("eItem").value = ""; $("eAmt").value = ""; renderMoney(); toast("追加しました");
};
$("copy").onclick = async () => {
  const lines = ["【北海道旅行の精算】", ...state.exps.map(e => `・${e.item} ${yen(e.amt)}（${state.members[e.payer]}）`), "合計 " + yen(state.exps.reduce((s,e)=>s+e.amt,0)), "", "▼支払い"];
  const s = settle();
  lines.push(...(s.length ? s.map(([f,t,x]) => `${state.members[f]} → ${state.members[t]}：${yen(x)}`) : ["貸し借りなし"]));
  const text = lines.join("\n");
  try{ await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch(e){ prompt("コピーして LINE に貼ってください", text); }
};
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); }

/* タブ */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["plan","prep","money"].forEach(k => $("tab-"+k).hidden = k !== b.dataset.tab);
  window.scrollTo(0,0);
});

countdown(); renderDays(); renderPlan();
renderChecks($("resv"), RESV); renderChecks($("items"), ITEMS);
renderMembers(); renderMoney();
</script>
</body>
