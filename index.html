<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>北海道 男三人旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#EEF3F4; --paper:#FFFFFF; --ink:#16262B; --mute:#5D7077;
  --sign:#00704A; --sign-deep:#00573A; --caution:#F2C200; --line:#D3DEE1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --snow:#0F1A1D; --paper:#17262A; --ink:#E6EEF0; --mute:#93A7AD;
    --sign:#0E8A5D; --sign-deep:#0A6E4A; --caution:#E5B800; --line:#2A3D42;
  }
}
:root[data-theme="dark"]{
  --snow:#0F1A1D; --paper:#17262A; --ink:#E6EEF0; --mute:#93A7AD;
  --sign:#0E8A5D; --sign-deep:#0A6E4A; --caution:#E5B800; --line:#2A3D42;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--snow); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-feature-settings:"tnum"}
.wrap{max-width:560px; margin:0 auto; padding:0 16px}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--caution); outline-offset:2px}

/* 案内標識のヒーロー */
.sign{
  margin:16px 0 20px; background:var(--sign); color:#fff; border-radius:10px;
  padding:6px; box-shadow:0 0 0 2px var(--sign-deep);
}
.sign-in{border:2px solid #fff; border-radius:6px; padding:14px 16px 12px}
.sign h1{margin:0 0 10px; font-size:22px; font-weight:700; letter-spacing:.04em}
.route{display:grid; gap:6px}
.route-row{display:flex; align-items:baseline; gap:12px}
.route-row .d{font-size:15px; opacity:.85; width:5.2em; flex:none}
.route-row .to{font-size:20px; font-weight:700}
.route-row .km{margin-left:auto; font-size:14px; border:1.5px solid #fff; border-radius:4px; padding:0 6px}
.sign-foot{display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:2px solid rgba(255,255,255,.55); font-size:14px}
.sign-foot b{font-size:20px; font-weight:700}

/* 日付の切り替え */
.days{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:14px}
.days button{
  border:2px solid var(--line); background:var(--paper); border-radius:8px; padding:6px 0;
  display:flex; flex-direction:column; align-items:center; cursor:pointer;
}
.days button .num{font-size:24px; line-height:1}
.days button span:last-child{font-size:13px; color:var(--mute)}
.days button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.days button[aria-pressed="true"] span:last-child{color:inherit; opacity:.8}
.theme{margin:0 0 6px; font-size:19px; font-weight:700}
.theme-sub{margin:0 0 16px; color:var(--mute); font-size:14px}

/* 行程 */
.tl{list-style:none; margin:0; padding:0; border-left:3px solid var(--line); margin-left:58px}
.tl li{position:relative; padding:0 0 16px 16px}
.tl li::before{content:""; position:absolute; left:-8px; top:8px; width:13px; height:13px; border-radius:50%; background:var(--paper); border:3px solid var(--sign)}
.tl li.now::before{background:var(--caution); border-color:var(--ink)}
.tl .t{position:absolute; left:-66px; top:1px; width:50px; text-align:right; font-size:18px; color:var(--mute); line-height:1.3}
.tl .what{font-weight:700}
.tl .where{font-size:14px; color:var(--mute)}
.tl .note{font-size:14px; margin-top:2px}
.map{
  display:inline-flex; align-items:center; gap:4px; margin-top:4px; padding:3px 10px 3px 8px; min-height:30px;
  border:1.5px solid var(--sign); border-radius:15px; color:var(--sign); font-size:13px; font-weight:700; text-decoration:none;
}
.status{margin:-8px 0 14px; font-size:13px; color:var(--sign); font-weight:700}
.status.warn{color:var(--ink); background:var(--caution); padding:4px 10px; border-radius:6px; font-weight:500}
input[type=password]{width:100%; border:2px solid var(--line); background:var(--snow); border-radius:7px; padding:8px 10px; min-height:44px}
.ops-line{display:flex; gap:8px; margin-top:6px}
.ops-line button{border:1.5px solid var(--line); background:var(--paper); border-radius:6px; padding:2px 12px; min-height:34px; font-size:14px; cursor:pointer}
#editTools .btn{margin-top:4px}
dialog{border:0; border-radius:12px; padding:18px 16px; width:min(92vw,420px); background:var(--paper); color:var(--ink)}
dialog::backdrop{background:rgba(10,20,24,.5)}
dialog h2{margin:0 0 10px; font-size:18px}
dialog label{display:block; font-size:13px; color:var(--mute); margin-top:8px}
dialog label input, dialog label select{margin-top:3px; color:var(--ink)}
dialog .row2 .btn{margin-top:14px}
.map::before{content:""; width:8px; height:8px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--sign)}
.flag{
  display:inline-block; margin-left:6px; padding:0 7px; border-radius:4px; font-size:12px; font-weight:700;
  background:var(--caution); color:#16262B; vertical-align:2px;
}
.tl li.now .what::after{content:"いまここ"; margin-left:8px; font-size:12px; color:var(--sign); font-weight:700}

/* 共通の箱 */
section[hidden]{display:none}
.block{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px}
.block h2{margin:0 0 8px; font-size:17px}
.help{margin:0 0 10px; font-size:13px; color:var(--mute)}
.check{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--sign); flex:none}
.check small{display:block; color:var(--mute); font-size:13px}
.check label{flex:1; cursor:pointer}
.check input:checked + label{color:var(--mute); text-decoration:line-through}
.check .ops{display:flex; gap:2px; flex:none}
.check .ops button{border:0; background:none; color:var(--mute); font-size:13px; padding:2px 6px; min-height:32px; cursor:pointer}
.addrow{display:flex; gap:8px; margin-top:10px}
.addrow button{flex:none; border:0; border-radius:7px; background:var(--sign); color:#fff; font-weight:700; padding:0 16px; min-height:44px; cursor:pointer}

/* 精算 */
.members{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
input[type=text],input[type=number],input[inputmode],select{
  width:100%; border:2px solid var(--line); background:var(--snow); border-radius:7px; padding:8px 10px; min-height:44px;
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.split{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:14px}
.split label{display:flex; gap:6px; align-items:center}
.split input{accent-color:var(--sign); width:18px; height:18px}
.btn{
  margin-top:10px; width:100%; min-height:46px; border:0; border-radius:8px; background:var(--sign); color:#fff; font-weight:700; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.exp{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:15px}
.exp:first-child{border-top:0}
.exp small{display:block; color:var(--mute); font-size:12px}
.exp .amt{font-size:20px; white-space:nowrap}
.exp button{border:0; background:none; color:var(--mute); font-size:13px; cursor:pointer; padding:0 0 0 8px; min-height:32px}
.empty{color:var(--mute); font-size:14px; margin:0}
.pay{display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:16px}
.pay:first-child{border-top:0}
.pay .arrow{color:var(--mute)}
.pay .amt{margin-left:auto; font-size:24px; font-weight:700}
.total{display:flex; justify-content:space-between; font-size:14px; color:var(--mute); margin-bottom:6px}
.total b{font-size:18px; color:var(--ink)}

/* 下のタブ */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); z-index:5;
}
nav.tabs .in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0; background:none; padding:10px 0 12px; font-size:15px; font-weight:700; color:var(--mute); cursor:pointer; border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--sign); border-top-color:var(--sign)}
.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="sign" aria-label="旅の概要">
    <div class="sign-in">
      <h1>北海道 男三人旅</h1>
      <div class="route">
        <div class="route-row"><span class="d">13日 金</span><span class="to">札幌</span><span class="km">市場と夜</span></div>
        <div class="route-row"><span class="d">14日 土</span><span class="to">小樽・余市</span><span class="km">ドライブ</span></div>
        <div class="route-row"><span class="d">15日 日</span><span class="to">定山渓</span><span class="km">温泉</span></div>
      </div>
      <div class="sign-foot">
        <span>新千歳着 <b class="num">9:15</b></span>
        <span id="countdown"></span>
        <span>新千歳発 <b class="num">20:20</b></span>
      </div>
    </div>
  </header>

  <p class="status" id="status" role="status" hidden></p>

  <dialog id="gate" aria-labelledby="gateTitle">
    <form id="gateForm">
      <h2 id="gateTitle">合言葉を入れてください</h2>
      <p class="help">LINE で共有された合言葉です。一度入れると、このスマホが覚えます。</p>
      <label>合言葉<input type="password" id="gatePass" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <p class="help" id="gateMsg" style="color:#B3261E"></p>
      <button class="btn">開く</button>
    </form>
  </dialog>

  <section id="tab-plan" aria-label="行程">
    <div class="days" id="days"></div>
    <p class="theme" id="theme"></p>
    <p class="theme-sub" id="themeSub"></p>
    <ol class="tl" id="timeline"></ol>
    <div id="editTools" hidden>
      <button class="btn" id="addPlan">この日に予定を追加</button>
      <button class="btn ghost" id="resetPlan">最初の行程に戻す</button>
      <p class="help" style="margin-top:8px">直した行程はこのスマホにだけ残ります。</p>
    </div>
    <button class="btn ghost" id="editToggle">行程を編集する</button>
  </section>

  <dialog id="dlg" aria-labelledby="dlgTitle">
    <form id="dlgForm">
      <h2 id="dlgTitle">予定を追加</h2>
      <label>時間<input type="text" id="fT" inputmode="numeric" placeholder="例: 12:30"></label>
      <label>予定<input type="text" id="fWhat" placeholder="例: 味噌ラーメン"></label>
      <label>場所（地図で検索する言葉）<input type="text" id="fWhere" placeholder="例: すみれ 札幌すすきの店"></label>
      <label>メモ<input type="text" id="fNote" placeholder="なくてもOK"></label>
      <label>印<select id="fFlag"><option value="">なし</option><option>確認</option><option>予約</option><option>相談</option></select></label>
      <div class="row2"><button type="button" class="btn ghost" id="dlgCancel">やめる</button><button class="btn">保存する</button></div>
    </form>
  </dialog>

  <section id="tab-prep" aria-label="準備" hidden>
    <div class="block">
      <h2>予約・確認</h2>
      <p class="help">済んだらチェック。追加・直す・消すもできます。変更はこのスマホにだけ残ります。</p>
      <div id="resv"></div>
    </div>
    <div class="block">
      <h2>持ち物</h2>
      <div id="items"></div>
    </div>
  </section>

  <section id="tab-money" aria-label="精算" hidden>
    <div class="block">
      <h2>メンバー</h2>
      <div class="members" id="members"></div>
    </div>
    <div class="block">
      <h2>立て替えを追加</h2>
      <input type="text" id="eItem" placeholder="何に払った？（例: ガソリン）" aria-label="項目">
      <div class="row2">
        <input type="number" id="eAmt" inputmode="numeric" min="0" placeholder="金額（円）" aria-label="金額">
        <select id="ePayer" aria-label="払った人"></select>
      </div>
      <div class="split" id="eSplit" aria-label="割る人"></div>
      <button class="btn" id="eAdd">追加する</button>
    </div>
    <div class="block">
      <div class="total"><span>これまでの合計</span><b class="num" id="sum">0円</b></div>
      <div id="expList"></div>
    </div>
    <div class="block">
      <h2>だれが、だれに払う</h2>
      <div id="settle"></div>
      <button class="btn ghost" id="copy">LINE に貼る用にコピー</button>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="ページ切り替え">
  <div class="in" role="tablist">
    <button role="tab" aria-selected="true" data-tab="plan">行程</button>
    <button role="tab" aria-selected="false" data-tab="prep">準備</button>
    <button role="tab" aria-selected="false" data-tab="money">精算</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>

  {date:"2026-11-13", d:"13", w:"金", theme:"北海道上陸、札幌で食べて飲む", sub:"二条市場 → ビール博物館 → サウナ → すすきの", plan:[

];

const $ = id => document.getElementById(id);

/* 3人で共有する仕組み
   API に Google Apps Script のウェブアプリの URL を入れると共有モードになる。空のままならこのスマホだけで動く。
   合言葉はコードに書かず、最初に開いたときに入力してもらい、このスマホに覚えさせる。 */
const API = "https://script.google.com/macros/s/AKfycbwIOcNpkfWtCMNl01LCgTV-Tc4ecbG3iSXjN9C6hq5NlOTU_L-1VdpG-TqYMO7XSiIr/exec";
let pass = "", queue = [], syncing = false, again = false, pendingRefresh = false;
try{ pass = localStorage.getItem(KEY + "-pass") || ""; }catch(e){}
try{ queue = JSON.parse(localStorage.getItem(KEY + "-q")) || []; }catch(e){}
function saveQ(){ try{ localStorage.setItem(KEY + "-q", JSON.stringify(queue)); }catch(e){} }

function commit(op){
  save();
  if(!API) return;
  queue.push(JSON.parse(JSON.stringify(op))); saveQ(); sync();
}
function applyLocal(op){
  switch(op.type){
    case "setPlan": state.plan = op.value; break;
    case "setLists": state.lists = op.value; break;
    case "setMembers": state.members = op.value; break;
    case "check": state.checks[op.k] = !!op.v; break;
    case "addExp": if(!state.exps.some(x => x.id === op.exp.id)) state.exps.push(op.exp); break;
    case "delExp": state.exps = state.exps.filter(x => x.id !== op.id); break;
  }
}
function setStatus(msg, warn){
  const el = $("status"); el.hidden = false; el.textContent = msg; el.classList.toggle("warn", !!warn);
}
function hhmm(iso){ if(!iso) return ""; const d = new Date(iso); return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"); }

async function sync(){
  if(!API || !pass) return;
  if(syncing){ again = true; return; }
  syncing = true;
  const ops = queue.slice();
  try{
    const res = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({pass, ops})});
    const data = await res.json();
    if(!data.ok){
      if(data.error === "wrong_pass"){
        pass = ""; try{ localStorage.removeItem(KEY + "-pass"); }catch(e){}
        showGate("合言葉が違います。もう一度入れてください。");
      }else if(data.error === "locked"){
        setStatus("合言葉の間違いが続いたので、10分ほど受け付けを止めています。しばらくしてから開き直してください。", true);
      }else if(data.error === "invalid" || data.error === "too_large"){
        // 保存できない変更は捨てて、共有データを読み直す
        queue.splice(0, ops.length); saveQ(); again = true;
        setStatus(data.error === "too_large" ? "データが大きすぎて保存できませんでした。" : "保存できない内容があったので、取り消しました。", true);
      }else setStatus("共有できませんでした（" + data.error + "）", true);
      return;
    }
    queue.splice(0, ops.length); saveQ();
    const s = data.state || {};
    if(s.plan == null || s.lists == null || s.members == null){
      // 共有データがまだ空なら、このスマホの内容を最初のデータとして送る
      queue.unshift({type:"init", value:{plan:state.plan, lists:state.lists, members:state.members, checks:state.checks, exps:state.exps}});
      saveQ(); again = true;
    }else{
      state.plan = s.plan; state.lists = s.lists; state.members = s.members;
      state.checks = s.checks || {}; state.exps = s.exps || [];
      queue.forEach(applyLocal); save(); refresh();
      setStatus("3人で共有中・" + hhmm(s.updatedAt) + " 更新");
    }
  }catch(e){
    setStatus("電波がないので、このスマホに保存中。つながったら自動で送ります。", true);
  }finally{
    syncing = false;
    if(again){ again = false; sync(); }
  }
}
function busy(){
  const a = document.activeElement;
  return $("dlg").open || $("gate").open || (a && (a.tagName === "INPUT" || a.tagName === "SELECT") && a.type !== "checkbox");
}
function refresh(){
  if(busy()){ pendingRefresh = true; return; }
  pendingRefresh = false;
  renderPlan(); renderChecks($("resv"), "resv"); renderChecks($("items"), "items"); renderMembers(); renderMoney();
}
document.addEventListener("focusout", () => setTimeout(() => { if(pendingRefresh) refresh(); }, 0));
function showGate(msg){
  $("gateMsg").textContent = msg || "";
  if(!$("gate").open) $("gate").showModal();
  $("gatePass").focus();
}
$("gateForm").onsubmit = e => {
  e.preventDefault();
  const v = $("gatePass").value.normalize("NFKC").trim(); if(!v) return;
  pass = v; try{ localStorage.setItem(KEY + "-pass", v); }catch(e){}
  $("gate").close(); $("gatePass").value = ""; setStatus("共有データを読み込み中…"); sync();
};
$("gate").addEventListener("cancel", e => e.preventDefault());
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => Math.round(n).toLocaleString("ja-JP") + "円";

/* 日付と「いまここ」 */
function todayStr(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
const today = todayStr();
let current = Math.max(0, DAYS.findIndex(d => d.date === today));

function countdown(){
  const start = new Date("2026-11-13T09:15:00+09:00"), end = new Date("2026-11-15T20:20:00+09:00"), now = new Date();
  let t;
  if(now < start){ const days = Math.ceil((start - now) / 86400000); t = "出発まで " + days + "日"; }
  else if(now <= end){ const i = DAYS.findIndex(d => d.date === today); t = (i + 1) + "日目"; }
  else t = "おつかれさま";
  $("countdown").textContent = t;
}

function renderDays(){
  $("days").innerHTML = DAYS.map((d,i) =>
    `<button aria-pressed="${i===current}" data-i="${i}"><span class="num">${d.d}</span><span>${d.w}曜</span></button>`).join("");
  $("days").querySelectorAll("button").forEach(b => b.onclick = () => { current = +b.dataset.i; renderDays(); renderPlan(); });
}
/* 行程（このスマホで追加・直す・消すができる） */
const defaultPlan = () => DAYS.map(d => d.plan.map(([t,what,where="",note="",flag=""]) => ({t, what, where, note, flag, map: MAP[what] || ""})));
if(!state.plan) state.plan = defaultPlan();
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? (+m[1])*60 + (+m[2]) : 9999; };
let editing = false, editAt = null;

function nowIndex(i){
  if(DAYS[i].date !== today) return -1;
  const n = new Date(), mins = n.getHours()*60 + n.getMinutes();
  let idx = -1;
  state.plan[i].forEach((p,j) => { if(toMin(p.t) <= mins) idx = j; });
  return idx;
}
function renderPlan(){
  const day = DAYS[current], list = state.plan[current], ni = editing ? -1 : nowIndex(current);
  $("theme").textContent = day.theme;
  $("themeSub").textContent = day.sub;
  $("timeline").innerHTML = list.map((p,i) => {
    const q = p.map || p.where;
    return `<li class="${i===ni?"now":""}"><span class="t num">${esc(p.t)}</span>
      <div class="what">${esc(p.what)}${p.flag?`<span class="flag">${esc(p.flag)}</span>`:""}</div>
      ${p.where?`<div class="where">${esc(p.where)}</div>`:""}
      ${p.note?`<div class="note">${esc(p.note)}</div>`:""}
      ${q && !editing?`<a class="map" href="${mapUrl(q)}" target="_blank" rel="noopener">地図を開く</a>`:""}
      ${editing?`<div class="ops-line"><button data-act="edit" data-i="${i}">直す</button><button data-act="del" data-i="${i}">消す</button></div>`:""}</li>`;
  }).join("") || `<li><p class="empty">この日の予定はまだありません。</p></li>`;
  $("editTools").hidden = !editing;
  $("editToggle").textContent = editing ? "編集を終える" : "行程を編集する";
  $("timeline").querySelectorAll("button[data-act]").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(b.dataset.act === "del"){
      if(!confirm(`「${list[i].what}」を消しますか？`)) return;
      list.splice(i,1); commit({type:"setPlan", value:state.plan}); renderPlan();
    }else openDialog(i);
  });
}
function openDialog(i){
  editAt = i;
  const p = i === null ? {t:"", what:"", where:"", note:"", flag:""} : state.plan[current][i];
  $("dlgTitle").textContent = (i === null ? "予定を追加" : "予定を直す") + `（${DAYS[current].d}日）`;
  $("fT").value = p.t; $("fWhat").value = p.what; $("fWhere").value = p.where; $("fNote").value = p.note; $("fFlag").value = p.flag || "";
  $("dlg").showModal();
}
$("dlgForm").onsubmit = e => {
  e.preventDefault();
  const what = $("fWhat").value.trim();
  if(!what){ toast("予定の名前を入れてください"); return; }
  const list = state.plan[current], old = editAt === null ? null : list[editAt];
  const where = $("fWhere").value.trim();
  const item = {t:$("fT").value.trim(), what, where, note:$("fNote").value.trim(), flag:$("fFlag").value,
    map: old && old.where === where ? old.map : ""};
  if(old) list[editAt] = item; else list.push(item);
  list.sort((a,b) => toMin(a.t) - toMin(b.t));
  commit({type:"setPlan", value:state.plan}); $("dlg").close(); renderPlan(); toast(old ? "直しました" : "追加しました");
};
$("dlgCancel").onclick = () => $("dlg").close();
$("editToggle").onclick = () => { editing = !editing; renderPlan(); };
$("addPlan").onclick = () => openDialog(null);
$("resetPlan").onclick = () => {
  if(!confirm("行程を最初の内容に戻しますか？ このスマホで直した分は消えます。")) return;
  state.plan = defaultPlan(); commit({type:"setPlan", value:state.plan}); renderPlan(); toast("最初の行程に戻しました");
};

/* 準備（項目の追加・編集・削除ができる） */
if(!state.lists) state.lists = {
  resv: RESV.map(([k,label,sub]) => ({k,label,sub})),
  items: ITEMS.map(([k,label,sub]) => ({k,label,sub}))
};
function renderChecks(el, key){
  const list = state.lists[key];
  el.innerHTML = list.map((it,i) =>
    `<div class="check"><input type="checkbox" id="c-${it.k}" data-k="${it.k}" ${state.checks[it.k]?"checked":""}>
      <label for="c-${it.k}">${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</label>
      <span class="ops"><button data-act="edit" data-i="${i}" aria-label="${esc(it.label)}を直す">直す</button><button data-act="del" data-i="${i}" aria-label="${esc(it.label)}を消す">消す</button></span></div>`).join("")
    + `<form class="addrow" data-key="${key}"><input type="text" placeholder="${key==="items"?"持ち物を追加（例: 傘）":"確認することを追加"}" aria-label="追加する項目"><button>追加</button></form>`;
  el.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = () => { state.checks[c.dataset.k] = c.checked; commit({type:"check", k:c.dataset.k, v:c.checked}); });
  el.querySelectorAll("button[data-act]").forEach(b => b.onclick = () => {
    const it = list[+b.dataset.i];
    if(b.dataset.act === "del"){
      if(!confirm(`「${it.label}」を消しますか？`)) return;
      list.splice(+b.dataset.i, 1); delete state.checks[it.k];
    }else{
      const label = prompt("項目の名前", it.label); if(label === null || !label.trim()) return;
      const sub = prompt("メモ（担当など。なくてもOK）", it.sub || "");
      it.label = label.trim(); it.sub = (sub || "").trim();
    }
    commit({type:"setLists", value:state.lists}); renderChecks(el, key);
  });
  el.querySelector("form").onsubmit = e => {
    e.preventDefault();
    const inp = e.target.querySelector("input"), label = inp.value.trim();
    if(!label) return;
    list.push({k:"u"+Date.now(), label, sub:""}); commit({type:"setLists", value:state.lists}); renderChecks(el, key); toast("追加しました");
  };
}

/* 精算 */
function renderMembers(){
  $("members").innerHTML = state.members.map((m,i) => `<input type="text" value="${esc(m)}" data-i="${i}" aria-label="メンバー${i+1}の名前">`).join("");
  $("members").querySelectorAll("input").forEach(inp => inp.onchange = () => {
    state.members[+inp.dataset.i] = inp.value.trim() || ("メンバー" + (+inp.dataset.i + 1)); commit({type:"setMembers", value:state.members}); renderMoney();
  });
}
function renderForm(){
  $("ePayer").innerHTML = state.members.map((m,i) => `<option value="${i}">${esc(m)}が払った</option>`).join("");
  $("eSplit").innerHTML = "<span>割る人:</span>" + state.members.map((m,i) => `<label><input type="checkbox" value="${i}" checked>${esc(m)}</label>`).join("");
}
function settle(){
  const bal = state.members.map(() => 0);
  state.exps.forEach(e => {
    const share = e.amt / e.split.length;
    bal[e.payer] += e.amt;
    e.split.forEach(i => bal[i] -= share);
  });
  const pos = [], neg = [];
  bal.forEach((b,i) => { if(b > 0.5) pos.push([i,b]); else if(b < -0.5) neg.push([i,-b]); });
  pos.sort((a,b) => b[1]-a[1]); neg.sort((a,b) => b[1]-a[1]);
  const out = [];
  while(pos.length && neg.length){
    const x = Math.min(pos[0][1], neg[0][1]);
    out.push([neg[0][0], pos[0][0], x]);
    pos[0][1] -= x; neg[0][1] -= x;
    if(pos[0][1] < 0.5) pos.shift();
    if(neg[0][1] < 0.5) neg.shift();
  }
  return out;
}
function renderMoney(){
  renderForm();
  const total = state.exps.reduce((s,e) => s + e.amt, 0);
  $("sum").textContent = yen(total);
  $("expList").innerHTML = state.exps.length ? state.exps.map((e,i) =>
    `<div class="exp"><div>${esc(e.item)}<small>${esc(state.members[e.payer])}が払った・${e.split.length===state.members.length?"全員で割る":e.split.map(j=>esc(state.members[j])).join("、")+"で割る"}</small></div>
     <div style="display:flex;align-items:center"><span class="amt num">${yen(e.amt)}</span><button data-id="${esc(e.id)}" aria-label="${esc(e.item)}を取り消す">取消</button></div></div>`).reverse().join("")
    : `<p class="empty">まだありません。払ったらすぐ上で追加しておくと、最後に揉めません。</p>`;
  $("expList").querySelectorAll("button").forEach(b => b.onclick = () => {
    const e = state.exps.find(x => x.id === b.dataset.id); if(!e) return;
    if(confirm(`「${e.item}」を取り消しますか？`)){
      state.exps = state.exps.filter(x => x.id !== e.id); commit({type:"delExp", id:e.id}); renderMoney();
    }
  });
  const s = settle();
  $("settle").innerHTML = s.length ? s.map(([from,to,x]) =>
    `<div class="pay"><span>${esc(state.members[from])}</span><span class="arrow">から</span><span>${esc(state.members[to])}へ</span><span class="amt num">${yen(x)}</span></div>`).join("")
    : `<p class="empty">いまは貸し借りなし。</p>`;
}
$("eAdd").onclick = () => {
  const item = $("eItem").value.trim(), amt = Math.round(Number($("eAmt").value));
  const split = [...$("eSplit").querySelectorAll("input:checked")].map(c => +c.value);
  if(!item || !(amt > 0)){ toast("項目と金額を入れてください"); return; }
  if(!split.length){ toast("割る人を1人以上選んでください"); return; }
  const exp = {id:"e" + Date.now() + Math.random().toString(36).slice(2,6), item, amt, payer:+$("ePayer").value, split};
  state.exps.push(exp);
  commit({type:"addExp", exp}); $("eItem").value = ""; $("eAmt").value = ""; renderMoney(); toast("追加しました");
};
$("copy").onclick = async () => {
  const lines = ["【北海道旅行の精算】", ...state.exps.map(e => `・${e.item} ${yen(e.amt)}（${state.members[e.payer]}）`), "合計 " + yen(state.exps.reduce((s,e)=>s+e.amt,0)), "", "▼支払い"];
  const s = settle();
  lines.push(...(s.length ? s.map(([f,t,x]) => `${state.members[f]} → ${state.members[t]}：${yen(x)}`) : ["貸し借りなし"]));
  const text = lines.join("\n");
  try{ await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch(e){ prompt("コピーして LINE に貼ってください", text); }
};
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); }

/* タブ */
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["plan","prep","money"].forEach(k => $("tab-"+k).hidden = k !== b.dataset.tab);
  window.scrollTo(0,0);
});

countdown(); renderDays(); renderPlan();
renderChecks($("resv"), "resv"); renderChecks($("items"), "items");
renderMembers(); renderMoney();
$("dlg").addEventListener("close", () => { if(pendingRefresh) refresh(); });
if(API){
  if(pass){ setStatus("共有データを読み込み中…"); sync(); } else showGate();
  setInterval(() => { if(document.visibilityState === "visible") sync(); }, 15000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") sync(); });
  window.addEventListener("online", sync);
}
</script>
</body>
</html>
